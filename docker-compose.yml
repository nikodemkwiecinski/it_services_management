# Course template - Lab 1 compose contract (API.md section 9), with Lab 3's kb-index, Prometheus and Grafana.
# The checker enforces: a service named exactly "svcdesk", port 8080 inside the container,
# SVCDESK_TEST_CLOCK set, no host-path bind mounts on any service, and images that need
# no network once built (dependencies are installed at build time, never at start).
#
#   docker compose up -d --build svcdesk kb-index         # the two services the checker starts
#   docker compose --profile observability up -d --build  # plus your own Prometheus (:9090) and Grafana (:3000)
services:
  svcdesk:
    build: .                      # copy Dockerfile.example to Dockerfile, or write your own
    ports:
      - "8080:8080"               # recommended for local work; the checker removes it in container mode
    environment:
      SVCDESK_TEST_CLOCK: "1"     # required: enables the X-Test-Clock header (API.md section 8)
      KB_INDEX_URL: http://kb-index:8080   # Lab 3 M-02
    depends_on:
      - kb-index
    volumes:
      - svcdesk-data:/data        # a NAMED volume is fine; "./data:/data" (a bind mount) fails check 1.02
    # A healthcheck makes "docker compose up --wait" wait for readiness.
    # python:3.13-slim has no curl, so this one uses Python.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Lab 3 (M-01): the upstream index behind GET /kb/search. The checker replaces the image and the login.
  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: nikodemkwiecinski   # the GitHub login the receipts carry
    ports:
      - "8081:8080"               # optional: /stats and /admin/degrade from the host
    # No healthcheck: the image has no shell, so a check run inside it never passes (L3-CORE-1.04).

  # Lab 3: our own Prometheus and Grafana, never started by the checker. Their configuration is baked into
  # images (prometheus/Dockerfile, grafana/Dockerfile) instead of bind-mounted: rebuild after a change.
  prometheus:
    build: ./prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"

  grafana:
    build: ./grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # dashboards readable without a login;
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer        # log in as admin (password admin at first) to edit

  # Lab 3 Stretch 2 (M-30): Toxiproxy in front of svcdesk, never started by the checker.
  #   docker compose --profile gap up -d toxiproxy
  # then create the proxy and its toxic through the API on 8474 (gap/README.md); the proxy listens on 8666.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0     # the tag has no "v"
    profiles: ["gap"]
    ports:
      - "8474:8474"                             # the API
      - "8666:8666"                             # the proxy in front of svcdesk

  # Stretch S3 (own tests): the checker builds every image up front (docker compose --profile tests build),
  # then runs "docker compose --profile tests run --rm --build tests" (300 s cap) and requires exit code 0 and a
  # last stdout line "ITSMLAB-TESTS: passed=<n> failed=0" with n >= 10. The runner is src/tests/run.py; pytest
  # is installed at build time from requirements.txt.
  tests:
    build: .
    profiles: ["tests"]
    working_dir: /app/src
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      SVCDESK_URL: http://svcdesk:8080   # the tests read the service URL from this variable
    command: ["python", "-m", "tests.run"]   # runs the suite, prints the ITSMLAB-TESTS line last

volumes:
  svcdesk-data:
